# Catppuccin Mocha
[display]
compact = false
use_pager = false

[updates]
auto_update = true
auto_update_interval_hours = 720

[style.description]
foreground = { rgb = { r = 205, g = 214, b = 244 } }

[style.command_name]
foreground = { rgb = { r = 166, g = 227, b = 161 } }
bold = true

[style.example_text]
foreground = { rgb = { r = 137, g = 180, b = 250 } }

[style.example_code]
foreground = { rgb = { r = 249, g = 226, b = 175 } }

[style.example_variable]
foreground = { rgb = { r = 250, g = 179, b = 135 } }
italic = true
