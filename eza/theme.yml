# Rosé Pine
colourful: true

filekinds:
  normal: { foreground: "#e0def4" }
  directory: { foreground: "#31748f", is_bold: true }
  symlink: { foreground: "#9ccfd8" }
  pipe: { foreground: "#6e6a86" }
  block_device: { foreground: "#eb6f92" }
  char_device: { foreground: "#eb6f92" }
  socket: { foreground: "#524f67" }
  special: { foreground: "#c4a7e7" }
  executable: { foreground: "#9ccfd8", is_bold: true }
  mount_point: { foreground: "#9ccfd8" }

perms:
  user_read: { foreground: "#f6c177" }
  user_write: { foreground: "#eb6f92" }
  user_execute_file: { foreground: "#9ccfd8" }
  user_execute_other: { foreground: "#9ccfd8" }
  group_read: { foreground: "#f6c177" }
  group_write: { foreground: "#eb6f92" }
  group_execute: { foreground: "#9ccfd8" }
  other_read: { foreground: "#f6c177" }
  other_write: { foreground: "#eb6f92" }
  other_execute: { foreground: "#9ccfd8" }
  special_user_file: { foreground: "#c4a7e7" }
  special_other: { foreground: "#524f67" }
  attribute: { foreground: "#908caa" }

size:
  major: { foreground: "#908caa" }
  minor: { foreground: "#9ccfd8" }
  number_byte: { foreground: "#e0def4" }
  number_kilo: { foreground: "#908caa" }
  number_mega: { foreground: "#31748f" }
  number_giga: { foreground: "#c4a7e7" }
  number_huge: { foreground: "#eb6f92" }
  unit_byte: { foreground: "#908caa" }
  unit_kilo: { foreground: "#31748f" }
  unit_mega: { foreground: "#c4a7e7" }
  unit_giga: { foreground: "#c4a7e7" }
  unit_huge: { foreground: "#eb6f92" }

users:
  user_you: { foreground: "#f6c177" }
  user_root: { foreground: "#eb6f92" }
  user_other: { foreground: "#c4a7e7" }
  group_yours: { foreground: "#9ccfd8" }
  group_other: { foreground: "#6e6a86" }
  group_root: { foreground: "#eb6f92" }

links:
  normal: { foreground: "#9ccfd8" }
  multi_link_file: { foreground: "#9ccfd8" }

git:
  new: { foreground: "#9ccfd8" }
  modified: { foreground: "#f6c177" }
  deleted: { foreground: "#eb6f92" }
  renamed: { foreground: "#9ccfd8" }
  typechange: { foreground: "#ebbcba" }
  ignored: { foreground: "#6e6a86" }
  conflicted: { foreground: "#eb6f92" }

date: { foreground: "#c4a7e7" }
inode: { foreground: "#908caa" }
blocks: { foreground: "#908caa" }
header: { foreground: "#908caa", is_underline: true }
octal: { foreground: "#908caa" }
punctuation: { foreground: "#6e6a86" }
broken_symlink: { foreground: "#eb6f92" }
