# tmux — чтобы сессия жила, когда отвалился телефон/SSH: переподключился → `t` → всё на месте.
# Префикс ctrl+a (на телефоне удобнее ctrl+b). Цвета — ANSI терминала: следуют теме и светлому режиму.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on                      # скролл и выбор панелей пальцем/мышью
set -g history-limit 50000
set -sg escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
setw -g aggressive-resize on         # экран телефона и Mac разного размера
set -g window-size latest
set -g set-titles on

# сплиты как в Ghostty, в той же папке
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf перечитан"

# статус-бар: минимальный, сверху
set -g status-position top
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=magenta,bold] #S #[fg=brightblack]│ "
set -g status-left-length 20
set -g status-right "#[fg=brightblack]#H · #[fg=blue]%H:%M "
setw -g window-status-format "#[fg=brightblack] #I #W "
setw -g window-status-current-format "#[fg=magenta,bold] #I #W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=magenta"
set -g message-style "bg=default,fg=magenta"
