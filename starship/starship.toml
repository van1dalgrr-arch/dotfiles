"$schema" = 'https://starship.rs/config-schema.json'

# ============================================================
#   Starship — Rosé Pine, скруглённые «таблетки»
# ============================================================

palette = "rose_pine"
add_newline = true

format = """
[](iris)$os[](bg:overlay fg:iris)$directory[](fg:overlay)\
( [](pine)$git_branch$git_status[](pine))\
( [](foam)$golang$python$docker_context[](foam))\
$fill$cmd_duration$time
[╰─](muted)$character"""

[fill]
symbol = " "

[os]
disabled = false
style = "bg:iris fg:base"
format = "[$symbol ]($style)"

[os.symbols]
Macos = ""

[directory]
style = "bg:overlay fg:text"
format = "[ $path ]($style)[$read_only]($read_only_style)"
read_only = " 󰌾"
read_only_style = "bg:overlay fg:love"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true

[directory.substitutions]
"~/dev" = "󰲋 dev"
"~/dotfiles" = " dotfiles"

[git_branch]
symbol = ""
style = "bg:pine fg:text"
format = "[$symbol $branch]($style)"

[git_status]
style = "bg:pine fg:gold"
format = "[( $all_status$ahead_behind)]($style)"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
untracked = "?${count}"
staged = "+${count}"
deleted = "✘${count}"

[golang]
symbol = ""
style = "bg:foam fg:base"
format = "[$symbol $version ]($style)"

[python]
symbol = ""
style = "bg:foam fg:base"
format = "[$symbol $version ]($style)"

[docker_context]
symbol = "󰡨"
style = "bg:foam fg:base"
format = "[$symbol $context ]($style)"
only_with_files = true

[cmd_duration]
min_time = 1000
style = "fg:gold"
format = "[󱎫 $duration ]($style)"

[time]
disabled = false
style = "fg:muted"
time_format = "%H:%M"
format = "[ $time]($style)"

[character]
success_symbol = "[ ❯](bold rose)"
error_symbol = "[ ❯](bold love)"
vimcmd_symbol = "[ ❮](bold foam)"

[palettes.rose_pine]
base = "#191724"
surface = "#1f1d2e"
overlay = "#26233a"
muted = "#6e6a86"
subtle = "#908caa"
text = "#e0def4"
love = "#eb6f92"
gold = "#f6c177"
rose = "#ebbcba"
pine = "#31748f"
foam = "#9ccfd8"
iris = "#c4a7e7"
