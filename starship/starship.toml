"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_mocha"
add_newline = true

format = """
[╭─](overlay1) $os$directory$git_branch$git_status$golang$docker_context$cmd_duration
[╰─](overlay1)$character"""

right_format = "$time"

[os]
disabled = false
style = "bold lavender"
format = "[$symbol]($style)"

[os.symbols]
Macos = " "

[directory]
style = "bold blue"
read_only = " 󰌾"
read_only_style = "red"
format = "[ $path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold mauve"
format = "[on](overlay1) [$symbol$branch]($style) "

[git_status]
style = "bold peach"
format = "([$all_status$ahead_behind]($style) )"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
untracked = "?${count}"
staged = "+${count}"
deleted = "✘${count}"

[golang]
symbol = " "
style = "bold sapphire"
format = "[via](overlay1) [$symbol$version]($style) "

[docker_context]
symbol = "󰡨 "
style = "bold sky"
format = "[$symbol$context]($style) "

[cmd_duration]
min_time = 1000
style = "bold yellow"
format = "[took](overlay1) [󱎫 $duration]($style)"

[character]
success_symbol = "[ ❯](bold green)"
error_symbol = "[ ✗](bold red)"

[time]
disabled = false
style = "overlay1"
time_format = "%H:%M"
format = "[$time]($style)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
