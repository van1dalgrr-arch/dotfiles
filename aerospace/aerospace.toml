# ============================================================
#   AeroSpace — тайлинг в стиле i3/Hyprland
#   Alt = главная клавиша (как Super в Linux)
# ============================================================

config-version = 2
start-at-login = true
# сохранил файл — AeroSpace сам перечитал конфиг
auto-reload-config = true
# с config-version 2 пустые столы 1–9 не пропадают только так
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']
# Ghostty сразу в фоне без окна — ctrl+` (quick terminal) работает из любого приложения
after-startup-command = ['exec-and-forget open -g -a Ghostty --args --initial-window=false --window-save-state=never']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
accordion-padding = 30

# Мышь переезжает за фокусом на другой монитор
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Хоткеи по коду клавиши — работают и на русской раскладке
[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 10
inner.vertical   = 10
outer.left       = 10
outer.bottom     = 10
outer.top        = 10
outer.right      = 10

[mode.main.binding]
# выпадающий терминал Ghostty из любого приложения (Ghostty не нужен «Универсальный доступ»)
ctrl-backtick = 'exec-and-forget ~/dotfiles/ghostty/quick-terminal.sh'
# Терминал / файлы / закрыть окно
alt-enter = 'exec-and-forget open -na Ghostty'
alt-e     = 'exec-and-forget open -na Ghostty --args -e yazi'
alt-q     = 'close'

# Фокус (vim-стрелки)
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Перемещение окна
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Раскладки
alt-slash  = 'layout tiles horizontal vertical'
alt-comma  = 'layout accordion horizontal vertical'
alt-shift-f = 'fullscreen'
alt-shift-space = 'layout floating tiling'

# Размер
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Рабочие столы (мгновенно, без анимации macOS)
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']

alt-tab       = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-shift-c = 'reload-config'
alt-shift-semicolon = 'mode service'
alt-r = 'mode resize'

# Режим ресайза: hjkl, Esc — выход
[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'

# Сервисный режим: r — сбросить раскладку, f — float/tile, backspace — закрыть все кроме текущего
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# ─── Приложения по рабочим столам ───
# 2 код · 3 браузер · 4 чаты · 5 музыка (терминал — где открыл)
# Ghostty — плавающий, на текущем столе. Без move-node-to-workspace: иначе выпадающий
# терминал (ctrl+`) тоже утаскивало на стол 1 и он «не открывался» на других столах
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'      # браузер — на стол 3
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'ru.keepcoder.Telegram'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace 5'

# Плавающие окна (диалоги, настройки, мелкие утилиты)
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'
