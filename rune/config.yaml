config_version: 2
# Rune — личный конфиг (~/.rune/config.yaml → симлинк сюда, ставит install.sh).
# Слои: встроенные умолчания (cmd/rune/rune.star) → этот файл → .rune/config.yaml в проекте.
# После правок: :write, затем ПОЛНЫЙ перезапуск Rune (тема и шрифт иначе не применятся).
# Переключить тему на лету: :guitheme neon-noir | :guitheme sunset | :guitheme dev-night

# ── ТРАФИК: ничего не ходит в сеть само ──────────────────────────
telemetry:
  enabled: false
upgrade:
  auto_check_enabled: false # обновление вручную: :upgrade
network:
  auto_join: false # поднять вручную: :network up
updates:
  auto_install: false # языковые пакеты — только с вопросом
log_level: info
log_path: ~/.rune/debug.log
# ── ВИД ──────────────────────────────────────────────────────────
gui:
  default_theme: neon-noir
  font_size: 15
  ligatures: true
  line_height_offset: 2
  scroll_multiplier: 3
  enable_transparent_window: true
  window_opacity: {fg: 1, bg: 0.92}
  window_blur_radius: 40
  themes:
    # Sunset — фиолетовый → розовый → оранжевый, как профиль GitHub. Графитовый фон без синевы,
    # один яркий акцент на роль: ключевые слова — фиолетовые, функции — розовые, типы — оранжевые.
    sunset:
      foreground: "#e6e3ef"
      background: "#0f0e14"
      cursor: "#f472b6"
      black: "#0f0e14"
      gray: "#1d1a27"
      silver: "#6e6884"
      white: "#f5f3fa"
      maroon: "#f43f5e"
      red: "#fb7185"
      green: "#9ee6b8"
      lime: "#fdba74"
      olive: "#fb923c"
      yellow: "#fcd34d"
      navy: "#251d3d"
      blue: "#818cf8"
      purple: "#a78bfa"
      magenta: "#c084fc"
      fuchsia: "#f472b6"
      teal: "#5eead4"
      cyan: "#f9a8d4"
      aqua: "#a5b4fc"
    # Neon Noir — жёсткая: угольный фон, неоновые акценты.
    # Rune красит всё через 16 именованных цветов:
    # silver — приглушённое (комментарии, номера строк), gray — подложки, остальное — акценты.
    neon-noir:
      foreground: "#e6e6e6"
      background: "#0a0a0a"
      cursor: "#ff2e88"
      black: "#0a0a0a"
      gray: "#1c1c1f"
      silver: "#5f5f66"
      white: "#f2f2f2"
      maroon: "#ff3b3b"
      red: "#ff5f5f"
      green: "#a6e22e"
      lime: "#c3f73a"
      olive: "#ff9f1c"
      yellow: "#ffd60a"
      navy: "#1b1035"
      blue: "#4d7cff"
      purple: "#b46cff"
      magenta: "#ff2e88"
      fuchsia: "#ff4fd8"
      teal: "#00c2c7"
      cyan: "#2ee6ff"
      aqua: "#7aa2ff"
    # Прежняя тема — оставлена, чтобы можно было вернуться через :guitheme dev-night
    dev-night:
      foreground: "#d6d9e8"
      background: "#101010"
      cursor: "#a855f7"
      black: "#101010"
      gray: "#1d1b26"
      silver: "#666666"
      white: "#d6d9e8"
      maroon: "#ef4444"
      red: "#f87171"
      green: "#9fb8e8"
      lime: "#b4c8f0"
      olive: "#f59e0b"
      yellow: "#f0d39c"
      navy: "#2a2350"
      blue: "#3b82f6"
      purple: "#a855f7"
      magenta: "#c084fc"
      fuchsia: "#c084fc"
      teal: "#0ea5e9"
      cyan: "#38bdf8"
      aqua: "#818cf8"
  env:
    # Rune из Dock не видит PATH из zsh: без этого не найдутся rune-ide, lazygit, freeze, claude…
    PATH: /Users/dev/dotfiles/bin:/opt/homebrew/bin:/opt/homebrew/sbin:/Users/dev/go/bin:/Users/dev/.local/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    GOBIN: /Users/dev/.rune/bin
    GOCACHE: /Users/dev/.rune/go/cache
    GOMODCACHE: /Users/dev/.rune/go/pkg/mod
    GOPATH: /Users/dev/.rune/go
    GOROOT: /Users/dev/.rune/lib/go
    GOTOOLCHAIN: auto
animations:
  loading_workspace: false
  open_workspace:
    enabled: false
  command_prompt:
    enabled: false
# ── РЕДАКТОР ─────────────────────────────────────────────────────
editor:
  mode: standard # клавиши как в Zed/VS Code
  autoindent: true
  auto_pair: true
  auto_save: true # сохраняет через ~2 с после правки
  tabspaces: 4
  ruler: 90
  initial_folds: true
  max_size_for_syntax: 1048576
  # Подсветка: только имена, которые есть в умолчаниях Rune
  highlights:
    comment: {fg: silver, flags: italic}
    keyword: {fg: magenta, flags: bold}
    function: {fg: cyan, flags: bold}
    "function.method": {fg: cyan}
    "function.builtin": {fg: yellow, flags: bold}
    type: {fg: lime, flags: bold}
    string: {fg: green}
    escape: {fg: olive, flags: bold}
    number: {fg: olive}
    "constant.builtin": {fg: olive, flags: bold}
    operator: {fg: fuchsia}
    property: {fg: aqua}
    variable: {fg: white}
    "markup.heading": {fg: magenta, flags: bold}
    "markup.raw": {fg: green}
    "markup.link.url": {fg: cyan, flags: underline}
    "markup.list": {fg: magenta, flags: bold}
    "markup.quote": {fg: silver, flags: italic}
  standard:
    search_attr: {fg: black, bg: yellow}
    search:
      match_attr: {fg: black, bg: yellow}
      focus_frame_attr: {fg: magenta, bg: default}
  aux_bar:
    enabled: true
    folds: true
    git: inline
    icons: true
    lines: absolute
    highlight_cursor: true
    line_number_attr: {fg: silver, bg: default} # было gray — номера почти не видно
    highlight_cursor_attr: {fg: magenta, bg: default, flags: bold}
    git_add_inline_attr: {fg: green, flags: bold}
    git_del_inline_attr: {fg: maroon, flags: bold}
  status_bar:
    enabled: true
    layout: ' {{ .Status | bg "magenta" | fg "black" | bold }}  {{ .Filepath | fg "white" | bold }}  {{ .GitShortRef | fg "purple" }}  {{ .GitDiffAdd | fg "green" }} {{ .GitDiffDel | fg "red" }} {{ .ShiftRight }} {{ .CursorLine | fg "cyan" }}:{{ .CursorColumn | fg "cyan" }}  {{ .TotalLines | fg "silver" }} lines  {{ .Language | bg "cyan" | fg "black" | bold }} '
    background_attr: {bg: gray}
  file_explorer:
    indent_attr: {fg: gray}
    icon_attr: {fg: purple}
  comments:
    go:
      block:
        - /*
        - '*/'
      line:
        - //
  icons:
    .go: "\U000F07D3"
# ── ОКНА И ВКЛАДКИ ───────────────────────────────────────────────
browser:
  window_manager:
    dim: true # неактивные панели притушены
    frame_attr: {fg: gray, bg: default}
    focus_frame_attr: {fg: magenta, bg: default}
    scroll_bar_attr: {fg: magenta, bg: default}
  focus_tab_attr: {fg: white, bg: default}
  dirty_tab_attr: {fg: magenta, bg: default, flags: [italic]}
  non_focus_tab_attr: {fg: silver, bg: default}
  focus_tab_icon_attr: {fg: cyan, bg: default}
  focus_tab_highlight_attr: {fg: magenta, bg: default}
workspace:
  home: "~"
  auto_restore: true
  symboldb: true
  wallpaper_attr: {fg: magenta, bg: default}
notifications:
  auto_close: 4s
# ── КОМАНДЫ И КЛАВИШИ ────────────────────────────────────────────
# Раскладка — как в GoLand для macOS, поверх пресета standard (Rune держит его в себе).
# AeroSpace забирает себе alt-h/j/k/l, alt-r, alt-q, alt-e, alt-enter, alt-1…9 и alt-shift-…,
# поэтому здесь только cmd / ctrl / ctrl-alt / cmd-alt и F-клавиши.
# F-клавиши на этом маке — через fn (fn-F8 и т.д.), у отладки есть дубли на ctrl-alt-стрелках.
# Редактор забирает свои клавиши РАНЬШЕ команд: бинд на cmd-[ (отступ), ctrl-T (переставить буквы),
# ctrl-enter (строка ниже), cmd-J/K/L, shift-tab, ctrl-alt-↑/↓/H/V, cmd-alt-[/]/V молча не сработает.
# Полный список — «Standard Editor» во встроенной документации Rune. Свободные слои: ctrl-alt, ctrl-cmd.
# Шпаргалка по всему: :cheatsheet (ctrl-cmd-/), все команды — cmd-shift-p.
command:
  key: "<s-m-p>" # cmd-shift-p — командная строка
  history_key: "<m-r>"
  max_history: 20000
  matched_text_attr: {fg: magenta, bg: default, flags: [bold]}
  focus_element_attr: {fg: cyan, bg: default}
  key_bindings:
    # файлы и поиск
    "<meta-s>": "write"
    "<meta-p>": "searchfile"
    "<shift-meta-o>": "searchfile" # GoLand: Go to File
    "<meta-o>": "searchtype" # GoLand: Go to Class — типы по всему проекту
    "<alt-meta-o>": "searchfunc" # GoLand: Go to Symbol — функции и методы
    "<meta-e>": "tabsearch" # GoLand: Recent Files
    "<shift-meta-f>": "searchtext" # GoLand: Find in Path
    "<shift-meta-s>": "searchtext"
    "<ctrl-alt-f>": "echo {prompt}gitgrep<space>" # git grep с переходом
    "<meta-f12>": "echo {prompt}jumptoast<space>locals.scm<space>local.definition.method|local.definition.function<space>" # File Structure
    "<alt-f>": "echo {prompt}jumptoast<space>locals.scm<space>local.definition.method|local.definition.function<space>"
    "<alt-v>": "echo {prompt}jumptoast<space>locals.scm<space>local.definition.var<space>"
    "<alt-s>": "echo {prompt}jumptoast<space>locals.scm<space>local.definition.type<space>"
    "<shift-meta-e>": "fexplorer" # дерево файлов (shift-tab в редакторе — «убрать отступ»)
    # вкладки (alt-h/l и alt-1…9 занял AeroSpace)
    "<meta-t>": "tabnew"
    "<alt-w>": "tabclose"
    "<alt-meta-w>": "tabcloseinactive" # GoLand: Close Others — закрыть все вкладки, кроме текущей
    "<shift-meta-w>": "tabcloseall" # закрыть все вкладки окна
    "<shift-meta-]>": "tabnext"
    "<shift-meta-[>": "tabprevious"
    "<ctrl-tab>": "tabnext"
    "<ctrl-shift-tab>": "tabprevious"
    "<ctrl-alt-]>": "tabmove right" # cmd-alt-[/] — сворачивание кода
    "<ctrl-alt-[>": "tabmove left"
    "<alt-`>": "tabsearch"
    "<ctrl-1>": "tabfocus 1"
    "<ctrl-2>": "tabfocus 2"
    "<ctrl-3>": "tabfocus 3"
    "<ctrl-4>": "tabfocus 4"
    "<ctrl-5>": "tabfocus 5"
    "<ctrl-6>": "tabfocus 6"
    "<ctrl-7>": "tabfocus 7"
    "<ctrl-8>": "tabfocus 8"
    "<ctrl-9>": "tabfocus 9"
    # окна
    "<meta-n>": "windownew"
    "<meta-w>": "windowclose"
    # cmd-J/K/L заняты редактором (склеить строки, префикс, выделить строку) — фокус на ctrl-cmd-стрелках
    "<ctrl-meta-left>": "windowfocus left"
    "<ctrl-meta-right>": "windowfocus right"
    "<ctrl-meta-down>": "windowfocus down"
    "<ctrl-meta-up>": "windowfocus up"
    "<ctrl-shift-meta-left>": "windowmove left"
    "<ctrl-shift-meta-right>": "windowmove right"
    "<ctrl-shift-meta-down>": "windowmove down"
    "<ctrl-shift-meta-up>": "windowmove up"
    "<shift-meta-backspace>": "windowresize reset"
    "<alt-meta-h>": "windowresize decrease width"
    "<alt-meta-j>": "windowresize decrease height"
    "<alt-meta-k>": "windowresize increase height"
    "<alt-meta-l>": "windowresize increase width"
    "<ctrl-meta-h>": "windowdefaultsplit h"
    "<ctrl-meta-v>": "windowdefaultsplit v"
    "<shift-meta-f12>": "windowtogglemaximize" # GoLand: Hide All Tool Windows
    "<ctrl-meta-m>": "windowtogglemaximize"
    # навигация по коду (GoLand)
    "<meta-b>": "lsp definition" # Go to Declaration
    "<alt-meta-b>": "lsp implementation" # Implementations — работает в обе стороны: тип ↔ интерфейс
    "<shift-meta-b>": "lsp type-definition" # Go to Type Declaration
    "<alt-f7>": "lsp references" # Find Usages
    "<ctrl-meta-u>": "lsp references" # то же без F-клавиши
    "<f1>": "lsp hover" # Quick Documentation
    "<ctrl-j>": "lsp hover"
    "<alt-i>": "lsp implementation"
    "<shift-meta-t>": "gototest" # Go to Test: x.go ↔ x_test.go
    "<alt-meta-left>": "cursorhistory prev" # Back (GoLand: cmd-alt-←; cmd-[ в редакторе — отступ)
    "<alt-meta-right>": "cursorhistory next" # Forward
    "<ctrl-o>": "cursorhistory prev"
    "<ctrl-i>": "cursorhistory next"
    # ошибки: F2 / shift-F2 как в GoLand; ctrl-cmd-j/l (ошибки) и ctrl-cmd-i/k (git) — из пресета
    "<f2>": "lspnextdiagnostic"
    "<shift-f2>": "lspprevdiagnostic"
    "<alt-shift-e>": "lsp diagnostics" # все проблемы файла списком
    # закладки (F2 ушла ошибкам)
    "<meta-f3>": "locationtoggle bookmark"
    "<f3>": "jumptolocation next bookmark"
    "<shift-f3>": "jumptolocation previous bookmark"
    # правка и рефакторинг (GoLand)
    "<ctrl-space>": "lsp complete" # на macOS сначала отключи ctrl-space в настройках клавиатуры
    "<ctrl-alt-p>": "lsp signature-help" # Parameter Info (alt-g теперь lazygit, как в nvim)
    "<shift-f6>": "lsp rename" # Rename
    "<alt-n>": "lsp rename"
    "<alt-b>": "lsp format"
    "<ctrl-alt-o>": "go organize-imports" # Optimize Imports
    "<ctrl-shift-t>": "echo {prompt}go<space>" # Refactor This: все рефакторинги gopls списком (ctrl-T — переставить буквы)
    "<meta-.>": "go fix-all" # все безопасные исправления в файле
    "<alt-meta-m>": "go extract-function" # Extract Method
    "<alt-shift-meta-m>": "go extract-method"
    "<alt-shift-meta-v>": "go extract-variable" # Introduce Variable (cmd-alt-V — история буфера обмена)
    "<alt-meta-c>": "go extract-constant" # Introduce Constant
    "<alt-meta-n>": "go inline-call" # Inline
    "<alt-meta-s>": "go fill-struct" # заполнить поля структуры
    "<alt-meta-t>": "go add-tags" # json-теги полям
    # запуск, тесты, отладка (GoLand: ctrl-alt-R / ctrl-alt-D)
    "<ctrl-alt-r>": "gorun" # go run main-пакета — вкладка-задача, ctrl-r перезапускает
    "<ctrl-shift-r>": "go test" # тест или бенчмарк под курсором
    "<ctrl-alt-t>": "gotests" # все тесты — вкладка, перезапуск при сохранении .go
    "<ctrl-alt-w>": "gowatch" # vet + тесты в фоне: зелёный/красный квадрат по краям
    "<ctrl-alt-l>": "golint" # golangci-lint → список с переходом
    "<ctrl-alt-e>": "goerrors" # ошибки сборки → список с переходом
    "<ctrl-alt-d>": "godebug" # отладка main-пакета до первой точки останова
    "<ctrl-shift-d>": "godebugtest" # отладка теста под курсором
    "<meta-f8>": "debugger set-breakpoint" # Toggle Breakpoint
    "<ctrl-alt-b>": "debugger set-breakpoint"
    "<f8>": "console debugger next" # Step Over
    "<f7>": "console debugger step-in" # Step Into
    "<shift-f8>": "console debugger step-out"
    "<alt-meta-r>": "console debugger continue" # Resume
    "<f9>": "console debugger continue"
    "<meta-f2>": "console debugger terminate" # Stop
    "<alt-f8>": "echo {prompt}console<space>debugger<space>evaluate<space>" # Evaluate
    # без F-клавиш (ctrl-alt-↑/↓ редактор забирает под прокрутку): Next · Into · Up
    "<ctrl-alt-n>": "console debugger next"
    "<ctrl-alt-i>": "console debugger step-in"
    "<ctrl-alt-u>": "console debugger step-out"
    "<alt-shift-enter>": "console" # консоль Rune: debugger, pkg, extensions
    # git (ctrl-cmd-i/k — прошлое/следующее изменение, из пресета)
    "<ctrl-alt-g>": "lg"
    "<ctrl-alt-a>": "linelog" # история строки под курсором
    "<ctrl-alt-y>": "filehistory" # история файла в lazygit (ctrl-alt-H — скрыть строки)
    # как в nvim — одно нажатие (alt-буквы, которые не занял AeroSpace). Логика — в bin/rune-ide,
    # та же, что в nvim. Определение/документация остались на cmd-B / F1 / ctrl-J.
    "<alt-o>": "containers" # orbstack — контейнеры
    "<alt-g>": "lg" # lazygit
    "<alt-p>": "postman" # api.http проекта — Postman в файле
    "<ctrl-alt-enter>": "httpsend" # отправить запрос под курсором (в .http); ctrl-enter — новая строка
    "<alt-a>": "endpoints" # все маршруты Gin, enter — к хендлеру
    "<alt-d>": "db" # база проекта
    "<alt-t>": "echo {prompt}task<space>" # задачи: up, air, тесты, линтер, compose… (tab — список)
    "<alt-c>": "claude" # Claude Code во вкладке
    "<ctrl-alt-c>": "review" # ревью ветки от Claude → список замечаний с переходом
    "<ctrl-alt-s>": "shot" # скриншот функции под курсором → буфер обмена
    # прочее
    "<meta-enter>": "terminalneworsplit"
    "<shift-meta-enter>": "!"
    "<meta-`>": "workspacesearch"
    "<meta-1>": "workspacefocus 1"
    "<meta-2>": "workspacefocus 2"
    "<meta-3>": "workspacefocus 3"
    "<meta-c>": "clipboardcopy"
    "<meta-v>": "clipboardpaste"
    "<meta-=>": "guifontsize increase"
    "<meta-->": "guifontsize decrease"
    "<meta-,>": "config"
    "<ctrl-meta-/>": "cheatsheet" # cmd-/ — комментарий, как в GoLand
    # ещё из GoLand
    "<shift-meta-n>": "scratch" # Scratch File: Go-файл с main, ctrl-alt-R запускает
    "<alt-shift-meta-c>": "copyref" # Copy Reference: путь:строка → буфер обмена
    "<alt-meta-i>": "echo {prompt}impl<space>" # Implement Methods: курсор на тип, tab — интерфейсы
    "<meta-q>": "quit"
    <a-s-f>: searchfunc
    <a-s-s>: searchtype
    <a-s-v>: searchvar
    <m-\\>: searchtext
    <m-p>: searchfile
    <s-m-f>: searchtext
    <a-m>: go organize-imports
  # Свои команды (вызываются из cmd-shift-p и клавишами выше).
  # Go-часть держит bin/rune-go: он находит модуль и main-пакет от файла в фокусе.
  aliases:
    e: {command: edit, completer: files}
    doctor: "! dot project doctor %"
    # запуск и тесты
    gorun: "tasknewtab run -- rune-go run $FILE_DIR"
    # задачи — из корня модуля открытого файла (rune-go in), а не воркспейса: Rune часто открыт на ~
    gotests: "tasknewtab tests *.go,go.mod -- rune-go in $FILE_DIR gotestsum --format testname -- ./..."
    gowatch:
      - "tasknew vet right *.go,go.mod -- rune-go in $FILE_DIR go vet ./..."
      - "tasknew test left *.go,go.mod -- rune-go in $FILE_DIR go test -short ./..."
    gowatchoff:
      - "taskclose vet"
      - "taskclose test"
    gocover: "! rune-go cover $FILE_DIR"
    gototest:
      - "!! T=$(rune-go test-file $FILE)"
      - "edit $T"
    # отладка: точки ставь заранее (cmd-F8) — они уходят в dlv на старте
    godebug:
      - "!! PKG=$(rune-go main $FILE_DIR)"
      - "console debugger terminate; debugger initialize go && debugger launch $PKG && debugger configured"
    godebugtest:
      - "!! NAME=$(rune-go test-name $FILE $LINE)"
      - "console debugger terminate; debugger initialize gotest && debugger launch $FILE_DIR -- -test.run ^$NAME$ && debugger configured"
    # проблемы списком: fuzzy-фильтр, превью, enter — переход
    golint: "locationpicker rune-go lint $FILE_DIR"
    govet: "locationpicker rune-go vet $FILE_DIR"
    goerrors: "locationpicker rune-go build $FILE_DIR"
    todo: "locationpicker git grep -n --column -E (TODO|FIXME|XXX|HACK)"
    gitgrep: "locationpicker git grep -n --column -- $1"
    conflicts: "locationpicker git grep -n --column -E ^(<<<<<<<|=======$|>>>>>>>)"
    changed: "locationpicker git diff --name-only HEAD"
    # git
    lg: "! lazygit"
    filehistory: "! lazygit -f $FILE"
    linelog: "! git log --oneline -L $LINE,$LINE:$FILE"
    gitdiff: "! git diff"
    gitblame: "! git blame $FILE"
    # ── как в nvim (bin/rune-ide — та же логика, что в nvim/lua/dotfiles) ──
    # Проект — git-корень открытого файла ($FILE_DIR), а не воркспейс: Rune часто открыт на ~.
    # db и orbstack — функция и алиас из zsh, поэтому через zsh -ic.
    containers: "! zsh -ic orbstack"
    db: "! cd \"$(rune-ide root $FILE_DIR)\" && zsh -ic db"
    claude: "! cd \"$(rune-ide root $FILE_DIR)\" && claude"
    gw: "! gw" # PR, Actions, логи CI
    ld: "! lazydocker"
    yazi: "! yazi $FILE_DIR"
    k8s: "! k9s"
    backup: "! dot backup"
    postman:
      - "!! F=$(rune-ide httpfile $FILE_DIR)"
      - "edit $F"
    httpsend: "! rune-ide http $FILE $LINE"
    endpoints: "locationpicker rune-ide endpoints $FILE_DIR"
    review: "locationpicker rune-ide review $FILE_DIR"
    shot: "! rune-ide shot $FILE $LINE"
    # ── как в GoLand ──
    scratch:
      - "!! F=$(rune-ide scratch)"
      - "edit $F"
    scratches: "locationpicker rune-ide scratches"
    copyref: "!! rune-ide ref $FILE $LINE"
    github: "!! rune-ide github $FILE $LINE" # Open on GitHub
    impl:
      command: "! rune-ide impl $FILE ${WORD:?курсор на имя типа} $1"
      completer: "! rune-ide interfaces $FILE_DIR"
    task:
      command: "tasknewtab $1 -- rune-ide task $1 $FILE_DIR $FILE"
      completer: "! rune-ide tasks $FILE_DIR"
    searchfunc: echo {prompt}searchast<space>locals.scm<space>local.definition.method|local.definition.function<enter>
    searchtype: echo {prompt}searchast<space>locals.scm<space>local.definition.type<enter>
    searchvar: echo {prompt}searchast<space>locals.scm<space>local.definition.var<enter>
# Отладчик: «go» ставит сам Go-пакет Rune (dlv dap). «gotest» — тот же dlv в режиме теста,
# им пользуется :godebugtest.
debugger:
  gotest:
    command: "dlv dap --listen={addr}"
    adapter_id: "dlv-dap"
    launch:
      mode: "test"
      outputMode: "remote"
  go:
    adapter_id: dlv-dap
    attach:
      mode: local
    command: dlv dap --listen={addr}
    launch:
      mode: debug
      outputMode: remote
terminal:
  max_lines: 5000
  dynamic_tab_name: true
# dot-расширение (rune/dot-ext, собирает install.sh)
extensions:
  dot:
    path: ~/go/bin/rune-dot
  fuzzy_search:
    config:
      file:
        algo: fuzzy
        case_sensitive: true
        count_attr:
          bg: default
          fg: default
        element_attr:
          bg: default
          fg: default
          flags:
            - dim
        focus_element_attr:
          bg: default
          fg: purple
        history: 50000
        history_key: <m-p>
        matched_text_attr:
          bg: default
          fg: blue
          flags:
            - bold
      line:
        algo: fuzzy
        case_sensitive: true
        count_attr:
          bg: default
          fg: default
        element_attr:
          bg: default
          fg: default
          flags:
            - dim
        focus_element_attr:
          bg: default
          fg: purple
        history: 2000
        history_key: <m-\\>
        matched_text_attr:
          bg: default
          fg: blue
          flags:
            - bold
      syntax:
        algo: fuzzy
        case_sensitive: true
    path: /Users/dev/.rune/bin/extension_fuzzy_search
  go:
    config:
      lsp_path: ""
    path: /Users/dev/.rune/bin/extension_go
tutorials:
  fuzzy_search: /Users/dev/.rune/pkg/fuzzy-search/v1.1.2/fuzzy_search.star
lsp:
  icons:
    bounds: "\U000F016A"
    compiler: ⚙
    escape: "\U000F005D"
    inline: "\U000F0054"
    nilcheck: ∅
