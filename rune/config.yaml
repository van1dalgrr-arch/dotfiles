config_version: 2

# Rune — личный конфиг (~/.rune/config.yaml → симлинк сюда, ставит install.sh).
# Слои: встроенные умолчания → этот файл → .rune/config.yaml в репозитории проекта.
# Перечитать без перезапуска: :workspacereload (тема и шрифт — только после перезапуска).
# Все ключи: cmd/rune/rune.star в исходниках Rune.

# ── ТРАФИК: ничего не ходит в сеть само ──────────────────────────
telemetry:
  enabled: false            # анонимная статистика — выключена
upgrade:
  auto_check_enabled: false # проверка новой версии раз в сутки — выключена; обновиться вручную: :upgrade
network:
  auto_join: false          # «сеть» Rune (порт 7473) при старте не поднимается; нужна — :network up
updates:
  auto_install: false       # языковые пакеты — только с вопросом

# ── ВИД ──────────────────────────────────────────────────────────
gui:
  default_theme: dev-night
  font_size: 15             # как в Zed
  ligatures: true
  enable_transparent_window: true
  window_opacity: { fg: 1, bg: 0.94 }
  window_blur_radius: 30    # как background-blur в Ghostty
  themes:
    # Dev Night — та же палитра, что у темы Zed (zed/dev-night-theme) и терминала.
    # Rune красит всё через 16 именованных цветов: silver — приглушённое (комментарии),
    # gray — подложки (выделение, панели), остальные — акценты.
    dev-night:
      foreground: "#d6d9e8"
      background: "#101010"
      cursor: "#a855f7"
      black: "#101010"
      gray: "#1d1b26"
      silver: "#666666"
      white: "#d6d9e8"
      maroon: "#ef4444"
      red: "#f87171"
      green: "#9fb8e8"
      lime: "#b4c8f0"
      olive: "#f59e0b"
      yellow: "#f0d39c"
      navy: "#2a2350"
      blue: "#3b82f6"
      purple: "#a855f7"
      magenta: "#c084fc"
      fuchsia: "#c084fc"
      teal: "#0ea5e9"
      cyan: "#38bdf8"
      aqua: "#818cf8"

# ── РЕДАКТОР ─────────────────────────────────────────────────────
# Раскладку (standard — как в Zed/VS Code) Rune при первом запуске пишет в этот же файл
# (editor.mode + key_bindings). Ниже — только то, что дополняет пресет.
editor:
  mode: standard          # клавиши как в Zed/VS Code (cmd-s, cmd-c/v, shift-стрелки)
  autoindent: true
  aux_bar:
    enabled: true
    folds: true
    git: inline
    lines: absolute
    highlight_cursor: true

command:
  key: "<s-m-p>"            # командная строка — cmd-shift-p, как палитра команд в Zed (":" в режиме standard нельзя)
  key_bindings:
    "<shift-tab>": "fexplorer"
    "<meta-r>": "history"
    "<meta-,>": "config"
    "<meta-/>": "cheatsheet"
    "<meta-q>": "quit"
    "<meta-=>": "guifontsize increase"
    "<meta-->": "guifontsize decrease"
    "<meta-t>": "tabnew"
    "<alt-enter>": "echo {prompt}windowconverttab<space>"
    "<alt-w>": "tabclose"
    "<alt-l>": "tabnext"
    "<alt-h>": "tabprevious"
    "<meta-n>": "windownew"
    "<meta-c>": "clipboardcopy"
    "<meta-v>": "clipboardpaste"
    "<alt-`>": "tabsearch"
    "<alt-shift-l>": "tabmove right"
    "<alt-shift-h>": "tabmove left"
    "<meta-h>": "windowfocus left"
    "<meta-l>": "windowfocus right"
    "<meta-j>": "windowfocus down"
    "<meta-k>": "windowfocus up"
    "<shift-meta-h>": "windowmove left"
    "<shift-meta-l>": "windowmove right"
    "<shift-meta-j>": "windowmove down"
    "<shift-meta-k>": "windowmove up"
    "<shift-meta-backspace>": "windowresize reset"
    "<shift-meta-+>": ["windowresize max width", "windowresize max height"]
    "<shift-meta-->": ["windowresize min width", "windowresize min height"]
    "<alt-meta-h>": "windowresize decrease width"
    "<alt-meta-j>": "windowresize decrease height"
    "<alt-meta-k>": "windowresize increase height"
    "<alt-meta-l>": "windowresize increase width"
    "<meta-w>": "windowclose"
    "<ctrl-meta-h>": "windowdefaultsplit h"
    "<ctrl-meta-v>": "windowdefaultsplit v"
    "<shift-meta-f>": "windowtogglemaximize"
    "<alt-f>": "echo {prompt}jumptoast<space>locals.scm<space>local.definition.method|local.definition.function<space>"
    "<alt-v>": "echo {prompt}jumptoast<space>locals.scm<space>local.definition.var<space>"
    "<alt-s>": "echo {prompt}jumptoast<space>locals.scm<space>local.definition.type<space>"
    "<alt-j>": "lspnextdiagnostic"
    "<alt-k>": "lspprevdiagnostic"
    "<alt-t>": "lsp hover"
    "<alt-shift-t>": "echo {prompt}lsp<space>hover<space>"
    "<alt-shift-e>": "lsp diagnostics"
    "<meta-f>": "lsp rename"
    "<alt-r>": "lsp references"
    "<alt-shift-r>": "echo {prompt}lsp<space>references<space>"
    "<alt-d>": "lsp definition"
    "<alt-shift-d>": "echo {prompt}lsp<space>definition<space>"
    "<alt-i>": "lsp implementation"
    "<alt-shift-i>": "echo {prompt}lsp<space>implementation<space>"
    "<ctrl-o>": "cursorhistory prev"
    "<ctrl-i>": "cursorhistory next"
    "<alt-b>": "lsp format"
    # on MacOS <ctrl-space> is a shortcut. To disable it and enable this
    # key binding, go to System Settings → Keyboard → Keyboard Shortcuts
    # → Input Sources → uncheck both entries.
    "<ctrl-space>": "lsp complete"
    "<alt-shift-j>": "gitnextchange"
    "<alt-shift-k>": "gitprevchange"
    "<meta-enter>": "terminalneworsplit"
    "<shift-meta-enter>": "!"
    "<meta-`>": "workspacesearch"
    "<alt-1>": "tabfocus 1"
    "<alt-2>": "tabfocus 2"
    "<alt-3>": "tabfocus 3"
    "<alt-4>": "tabfocus 4"
    "<alt-5>": "tabfocus 5"
    "<alt-6>": "tabfocus 6"
    "<alt-7>": "tabfocus 7"
    "<alt-8>": "tabfocus 8"
    "<alt-9>": "tabfocus 9"
    "<alt-shift-1>": "tabmove 1"
    "<alt-shift-2>": "tabmove 2"
    "<alt-shift-3>": "tabmove 3"
    "<alt-shift-4>": "tabmove 4"
    "<alt-shift-5>": "tabmove 5"
    "<alt-shift-6>": "tabmove 6"
    "<alt-shift-7>": "tabmove 7"
    "<alt-shift-8>": "tabmove 8"
    "<alt-shift-9>": "tabmove 9"
    "<meta-1>": "workspacefocus 1"
    "<meta-2>": "workspacefocus 2"
    "<meta-3>": "workspacefocus 3"
    "<meta-4>": "workspacefocus 4"
    "<meta-5>": "workspacefocus 5"
    "<meta-6>": "workspacefocus 6"
    "<meta-7>": "workspacefocus 7"
    "<meta-8>": "workspacefocus 8"
    "<meta-9>": "workspacefocus 9"
    "<shift-meta-1>": "workspacemove 1"
    "<shift-meta-2>": "workspacemove 2"
    "<shift-meta-3>": "workspacemove 3"
    "<shift-meta-4>": "workspacemove 4"
    "<shift-meta-5>": "workspacemove 5"
    "<shift-meta-6>": "workspacemove 6"
    "<shift-meta-7>": "workspacemove 7"
    "<shift-meta-8>": "workspacemove 8"
    "<shift-meta-9>": "workspacemove 9"
  # свои команды поверх встроенных: dotfiles прямо из командной строки Rune (:)
  aliases:
    doctor: "! dot project doctor %"      # что есть в проекте и чего не хватает
    gotest: "! go test ./..."
    govet: "! go vet ./..."
    lg: "! lazygit"

terminal:
  shell: zsh
  max_lines: 10000
  clipboard:
    write: true
    read: false

workspace:
  auto_restore: true

# расширение dot (rune/dot-ext, собирает install.sh): команды work, workoff, projectdoctor
extensions:
  dot:
    path: ~/go/bin/rune-dot
