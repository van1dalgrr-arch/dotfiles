# Раз в неделю — PR с обновлением закреплённых SHA экшенов и Go-модулей berth
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directories: [/berth, /rune/dot-ext]
    schedule:
      interval: weekly
    commit-message:
      prefix: berth
    groups:
      go:
        patterns: ["*"]
