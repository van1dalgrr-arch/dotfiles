# Проверки на каждый пуш: скрипты, zsh-конфиги, JSON-темы, утечки секретов, сами workflow.
# Сторонние экшены закреплены на полных SHA (тег — в комментарии), обновляет их Dependabot.
name: ci

on:
  push:
  pull_request:

# по умолчанию токен ничего не может; что нужно — выдаётся каждому job отдельно
permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action читает коммиты PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # gitleaks смотрит всю историю
          persist-credentials: false

      - name: actionlint (сами workflow)
        run: |
          v=1.7.12 sum=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSLo /tmp/al.tgz "https://github.com/rhysd/actionlint/releases/download/v$v/actionlint_${v}_linux_amd64.tar.gz"
          echo "$sum  /tmp/al.tgz" | sha256sum -c -
          tar -xzf /tmp/al.tgz -C /tmp actionlint
          /tmp/actionlint -color

      - name: shellcheck
        run: |
          shellcheck -S warning -e SC1090 \
            bin/dot lib/*.sh bootstrap.sh install.sh uninstall.sh macos.sh themes/apply.sh tests/*.sh \
            git/hooks/_chain git/hooks/pre-commit

      - name: Brewfile syntax
        run: ruby -c Brewfile && ruby -c Brewfile.devops

      - name: smoke tests (dot project doctor, tools)
        run: tests/smoke.sh

      - name: install / uninstall in a temp HOME
        run: tests/install.sh

      - name: zsh syntax
        run: |
          sudo apt-get install -y -qq zsh >/dev/null
          for f in zsh/.zshrc zsh/*.zsh; do zsh -n "$f" && echo "ok $f"; done

      - name: json / python
        run: |
          for f in zed/dev-night-theme/themes/*.json zed/dev-night-icons/icon_themes/*.json; do jq empty "$f" && echo "ok $f"; done
          python3 -m py_compile themes/set-wallpaper.py zed/tools/light.py zed/tools/preview.py jetbrains/build.py

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # на macOS-раннере go нет в PATH, а project doctor справедливо считает это ошибкой
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: berth (orbstack) — vet, tests, build
        run: cd berth && go vet ./... && go test ./... && go build -o /dev/null .

      - name: rune-dot (Rune extension) — vet, tests, build
        run: cd rune/dot-ext && go vet ./... && go test ./... && go build -o /dev/null .

      - name: Swift generators compile
        run: |
          for f in icons/wallpaper-*.swift; do
            case $f in *-kit.swift) continue ;; esac
            if grep -q runWallpaper "$f"; then cat icons/wallpaper-kit.swift "$f" > /tmp/w.swift; else cp "$f" /tmp/w.swift; fi
            swiftc -typecheck /tmp/w.swift && echo "ok $f"
          done
          for f in icons/icons.swift icons/folder.swift icons/backdrop.swift icons/html2png.swift icons/photo-wallpaper.swift ghostty/activate.swift icons/terminal-grade.swift zed/tools/build-icons.swift; do swiftc -typecheck "$f" && echo "ok $f"; done

      - name: scripts parse with system bash 3.2
        run: for f in bin/dot lib/*.sh bootstrap.sh install.sh uninstall.sh macos.sh tests/*.sh; do /bin/bash -n "$f" && echo "ok $f"; done

      - name: smoke tests (+ macos.sh preview, read-only)
        run: tests/smoke.sh

      - name: install / uninstall in a temp HOME (BSD tools, bash 3.2)
        run: /bin/bash tests/install.sh

      - name: dot doctor --json is valid JSON
        run: |
          bin/dot doctor --json > /tmp/doctor.json || true
          jq -e '.summary and (.checks | length > 0)' /tmp/doctor.json >/dev/null
          jq -r '.summary | "\(.ok) ok · \(.warn) warn · \(.fail) fail"' /tmp/doctor.json

      - name: every theme applies in a clean HOME
        run: |
          for t in themes/*.sh; do
            name=$(basename "$t" .sh); [ "$name" = apply ] && continue
            export HOME=$(mktemp -d)
            NO_WALLPAPER=1 NO_ICONS=1 ./themes/apply.sh "$name"
            test -s "$HOME/.config/ghostty/theme.ghostty" && test -s "$HOME/.cache/dotfiles-theme/starship.toml"
            echo "ok $name"
          done
