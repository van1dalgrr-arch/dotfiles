# Проверки на каждый пуш: скрипты, zsh-конфиги, JSON-темы, утечки секретов.
name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks смотрит всю историю

      - name: shellcheck
        run: |
          shellcheck -S warning -e SC1090 \
            bin/dot lib/*.sh install.sh uninstall.sh macos.sh themes/apply.sh tests/smoke.sh \
            git/hooks/_chain git/hooks/pre-commit

      - name: Brewfile syntax
        run: ruby -c Brewfile && ruby -c Brewfile.devops

      - name: smoke tests (dot project doctor, tools)
        run: tests/smoke.sh

      - name: zsh syntax
        run: |
          sudo apt-get install -y -qq zsh >/dev/null
          for f in zsh/.zshrc zsh/*.zsh; do zsh -n "$f" && echo "ok $f"; done

      - name: json / python
        run: |
          for f in zed/extension/themes/*.json zed/extension/icon_themes/*.json; do jq empty "$f" && echo "ok $f"; done
          python3 -m py_compile themes/set-wallpaper.py zed/extension/light.py zed/extension/preview.py

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # на macOS-раннере go нет в PATH, а project doctor справедливо считает это ошибкой
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Swift generators compile
        run: |
          for f in icons/wallpaper-*.swift; do
            case $f in *-kit.swift) continue ;; esac
            if grep -q runWallpaper "$f"; then cat icons/wallpaper-kit.swift "$f" > /tmp/w.swift; else cp "$f" /tmp/w.swift; fi
            swiftc -typecheck /tmp/w.swift && echo "ok $f"
          done
          for f in icons/icons.swift icons/folder.swift zed/extension/build.swift; do swiftc -typecheck "$f" && echo "ok $f"; done

      - name: scripts parse with system bash 3.2
        run: for f in bin/dot lib/*.sh install.sh uninstall.sh macos.sh tests/smoke.sh; do /bin/bash -n "$f" && echo "ok $f"; done

      - name: smoke tests (+ macos.sh preview, read-only)
        run: tests/smoke.sh

      - name: every theme applies in a clean HOME
        run: |
          for t in themes/*.sh; do
            name=$(basename "$t" .sh); [ "$name" = apply ] && continue
            export HOME=$(mktemp -d)
            NO_WALLPAPER=1 NO_ICONS=1 ./themes/apply.sh "$name"
            test -s "$HOME/.config/ghostty/theme.ghostty" && test -s "$HOME/.cache/dotfiles-theme/starship.toml"
            echo "ok $name"
          done
